<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="wetSoil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f2e18"/>
      <stop offset="60%" stop-color="#1e1b18"/>
      <stop offset="100%" stop-color="#141c24"/>
    </linearGradient>
    <linearGradient id="mudFlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#92400e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>
  <!-- Background hillside with heavy moisture saturation -->
  <rect width="800" height="500" fill="url(#wetSoil)"/>
  <!-- Rock outcrop layer -->
  <polygon points="50,40 320,160 520,90 760,190 800,280 420,310 80,240" fill="#475569" stroke="#334155" stroke-width="2"/>
  <!-- Subsurface water seepage channels emerging from slope toe -->
  <path d="M 320,165 C 340,240 280,310 290,500" fill="none" stroke="url(#mudFlow)" stroke-width="32" stroke-linecap="round"/>
  <path d="M 460,180 C 440,250 490,340 480,500" fill="none" stroke="url(#mudFlow)" stroke-width="26" stroke-linecap="round"/>
  <path d="M 520,220 C 580,290 620,380 640,500" fill="none" stroke="url(#mudFlow)" stroke-width="22" stroke-linecap="round"/>
  <path d="M 220,240 C 210,320 200,410 180,500" fill="none" stroke="url(#mudFlow)" stroke-width="18" stroke-linecap="round"/>
  <!-- Surface water glisten ripples -->
  <ellipse cx="290" cy="460" rx="90" ry="25" fill="rgba(96, 165, 250, 0.35)"/>
  <ellipse cx="490" cy="470" rx="110" ry="22" fill="rgba(96, 165, 250, 0.35)"/>
  <!-- AI Optical Detection Annotation Box -->
  <rect x="230" y="190" width="450" height="230" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="2" rx="4"/>
  <rect x="230" y="165" width="280" height="25" fill="#f59e0b" rx="4"/>
  <text x="240" y="182" font-family="monospace" font-size="12" font-weight="bold" fill="#000000">RAPID PORE SEEPAGE (SAT: 94.2%)</text>
  <!-- Telemetry HUD -->
  <rect x="20" y="20" width="340" height="60" fill="rgba(15, 23, 42, 0.85)" rx="8"/>
  <text x="35" y="42" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Cherrapunji Escarpment Sector 12</text>
  <text x="35" y="62" font-family="monospace" font-size="11" fill="#38bdf8">SOIL MOISTURE: 94.2% | CUMULATIVE 72h: 480mm</text>
</svg>
