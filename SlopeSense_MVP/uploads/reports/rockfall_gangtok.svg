<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gorge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Background mountain gorge -->
  <rect width="800" height="500" fill="url(#gorge)"/>
  <!-- Mountain ridge with fault scarp -->
  <polygon points="0,80 350,210 580,140 800,260 800,500 0,500" fill="#3b4252"/>
  <!-- Exposed failure joint plane / scarp -->
  <polygon points="280,180 520,130 570,250 310,310" fill="#b91c1c" fill-opacity="0.3" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Debris Cone & Boulders -->
  <polygon points="260,300 620,240 780,500 120,500" fill="#64748b"/>
  <!-- Large dislodged boulders on highway -->
  <polygon points="280,420 340,380 400,410 380,470 310,480" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="440,390 510,360 560,420 520,480 430,450" fill="#334155" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="210,440 250,420 280,460 230,480" fill="#1e293b"/>
  <!-- Highway barrier broken section -->
  <line x1="40" y1="460" x2="240" y2="450" stroke="#facc15" stroke-width="6"/>
  <line x1="560" y1="440" x2="760" y2="430" stroke="#facc15" stroke-width="6"/>
  <!-- AI Optical Detection Annotation Box -->
  <rect x="250" y="340" width="340" height="150" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="2" rx="4"/>
  <rect x="250" y="315" width="260" height="25" fill="#ef4444" rx="4"/>
  <text x="260" y="332" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">DEBRIS BLOCKAGE (EST. 45 m³)</text>
  <!-- Telemetry HUD -->
  <rect x="20" y="20" width="340" height="60" fill="rgba(15, 23, 42, 0.85)" rx="8"/>
  <text x="35" y="42" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">NH-10 Teesta River Corridor (Gangtok)</text>
  <text x="35" y="62" font-family="monospace" font-size="11" fill="#f87171">ROAD BLOCKED | HIGHWAY TEAM DISPATCHED</text>
</svg>
