<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="60%" stop-color="#713f12"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>
  <!-- Background / Sky -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <!-- Mountain Slope in background -->
  <polygon points="0,320 280,120 540,220 800,90 800,380 0,380" fill="url(#hill)"/>
  <!-- Retaining wall / Highway cut -->
  <polygon points="0,350 800,320 800,390 0,410" fill="#64748b"/>
  <!-- Highway Surface -->
  <polygon points="0,400 800,380 800,500 0,500" fill="url(#road)"/>
  <!-- Road yellow strip -->
  <line x1="40" y1="450" x2="200" y2="445" stroke="#facc15" stroke-width="4" stroke-dasharray="16,10"/>
  <line x1="280" y1="443" x2="520" y2="438" stroke="#facc15" stroke-width="4" stroke-dasharray="16,10"/>
  <line x1="600" y1="436" x2="760" y2="432" stroke="#facc15" stroke-width="4" stroke-dasharray="16,10"/>
  <!-- Longitudinal Tension Crack across asphalt and embankment -->
  <path d="M 120,490 Q 240,430 330,415 T 480,385 T 620,350 T 670,330" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
  <path d="M 120,490 Q 240,430 330,415 T 480,385 T 620,350 T 670,330" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="8,6"/>
  <!-- Branching cracks -->
  <path d="M 330,415 Q 380,440 440,460" fill="none" stroke="#0f172a" stroke-width="4"/>
  <path d="M 480,385 Q 490,410 520,430" fill="none" stroke="#0f172a" stroke-width="4"/>
  <!-- AI Optical Detection Annotation Box -->
  <rect x="260" y="360" width="380" height="90" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="2" rx="4"/>
  <rect x="260" y="335" width="220" height="25" fill="#ef4444" rx="4"/>
  <text x="270" y="352" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">CRACK DETECTED: 8.4cm (CRITICAL)</text>
  <!-- Telemetry HUD -->
  <rect x="20" y="20" width="310" height="60" fill="rgba(15, 23, 42, 0.85)" rx="8"/>
  <text x="35" y="42" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">NH-27 Guwahati Cut Slope #4B</text>
  <text x="35" y="62" font-family="monospace" font-size="11" fill="#38bdf8">GPS: 26.1445°N, 91.7362°E | DISPL: +14.2mm/24h</text>
</svg>
